<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万有引力 基本知識 ｜ 湘南高校物理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderReady=true; if(pendingRender) pendingRender()"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  background:#edf2f7;color:#1a202c;min-height:100vh;
}
header{
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);
  color:#fff;padding:14px 18px 12px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.hdr-school{font-size:11px;opacity:.75;margin-bottom:4px;letter-spacing:.5px;}
.hdr-title{font-size:19px;font-weight:700;letter-spacing:.5px;}
.hdr-sub{font-size:12px;opacity:.8;margin-top:4px;min-height:1em;}

/* ===== タブ ===== */
.tabs{background:#1e3a8a;}
.tabs-inner{display:flex;max-width:600px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{
  flex:1;min-width:60px;padding:10px 4px;text-align:center;
  font-size:11.5px;font-weight:600;color:rgba(255,255,255,.5);
  cursor:pointer;border-bottom:3px solid transparent;
  transition:all .2s;user-select:none;white-space:nowrap;
}
.tab.active{color:#fbbf24;border-bottom-color:#fbbf24;}
.tab.disabled{opacity:.3;cursor:not-allowed;}

/* ===== メイン ===== */
.main{max-width:600px;margin:0 auto;padding:14px 13px 60px;}

/* ===== モード切替 ===== */
.mode-row{
  display:flex;background:#fff;border-radius:10px;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px;
}
.mode-btn{
  flex:1;padding:11px 4px;border:none;background:#fff;
  color:#6b7280;font-size:12px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.mode-btn.active{background:#2563eb;color:#fff;}

/* ===== 出題順 ===== */
.order-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.order-label{font-size:12px;color:#64748b;}
.order-btn{
  padding:6px 14px;border:1.5px solid #cbd5e1;border-radius:16px;
  background:#fff;color:#64748b;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.order-btn.active{background:#2563eb;border-color:#2563eb;color:#fff;}

/* ===== 進捗 ===== */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.prog-bar{flex:1;height:5px;background:#cbd5e1;border-radius:3px;}
.prog-fill{height:100%;background:#2563eb;border-radius:3px;transition:width .35s ease;}
.prog-text{font-size:12px;color:#64748b;white-space:nowrap;}
.score-row{text-align:right;font-size:13px;color:#64748b;margin-bottom:12px;}

/* ===== 再チャレンジバッジ ===== */
.retry-badge{
  display:inline-block;background:#fffbeb;border:1px solid #fcd34d;
  color:#92400e;font-size:11.5px;font-weight:700;
  padding:4px 12px;border-radius:14px;margin-bottom:8px;
}

/* ===== 注記 ===== */
.sec-note{
  background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;
  padding:10px 14px;font-size:12.5px;color:#92400e;
  line-height:1.6;margin-bottom:10px;
}

/* ===== 問題カード ===== */
.q-card{
  background:#fff;border-radius:12px;padding:18px 20px;
  margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.09);
  border-left:4px solid #2563eb;
}
.q-num{font-size:11px;font-weight:700;color:#2563eb;margin-bottom:7px;letter-spacing:.5px;}
.q-ctx{
  font-size:13px;line-height:1.75;color:#475569;
  background:#f8fafc;border-left:3px solid #fbbf24;
  border-radius:0 6px 6px 0;padding:9px 13px;margin-bottom:10px;
}
.q-text{font-size:15px;line-height:1.75;}

/* ===== 選択肢 ===== */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.choice-btn{
  width:100%;padding:11px 15px;background:#fff;
  border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;
  font-size:14px;text-align:center;color:#374151;
  transition:all .15s;font-family:inherit;line-height:1.6;
  display:flex;align-items:center;justify-content:center;min-height:48px;
}
.choice-btn:hover:not(:disabled){border-color:#93c5fd;background:#eff6ff;}
.choice-btn.correct{border-color:#34d399;background:#ecfdf5;color:#065f46;font-weight:600;}
.choice-btn.wrong{border-color:#f87171;background:#fef2f2;color:#991b1b;}
.choice-btn:disabled{cursor:default;}

/* ===== フィードバック ===== */
.feedback{
  padding:12px 16px;border-radius:8px;font-size:13px;
  line-height:1.65;display:none;margin-bottom:12px;
}
.feedback.ok{display:block;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;}
.feedback.ng{display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;}
.fb-expl{color:#78350f;}

/* ===== 送信モード解説 ===== */
.sm-explanation{
  display:flex;gap:10px;align-items:flex-start;
  background:#fffbeb;border:1px solid #fcd34d;
  border-radius:8px;padding:12px 14px;
  font-size:13px;line-height:1.75;color:#78350f;
  margin-bottom:12px;
}
.sm-expl-icon{font-size:18px;flex-shrink:0;margin-top:1px;}

/* ===== 次へボタン ===== */
.next-btn{
  width:100%;padding:13px;background:#2563eb;color:#fff;
  border:none;border-radius:8px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .2s;
}
.next-btn:hover{background:#1e3a8a;}
.next-btn.green{background:#059669;}
.next-btn.green:hover{background:#047857;}
.next-btn.gray{background:#64748b;}
.next-btn.gray:hover{background:#475569;}

/* ===== 初学モード 解答エリア ===== */
.intro-answer{
  background:#ecfdf5;border:1px solid #6ee7b7;border-radius:10px;
  padding:14px 18px;margin-bottom:14px;
}
.intro-answer-label{font-size:11px;font-weight:700;color:#059669;letter-spacing:.5px;margin-bottom:8px;}
.intro-answer-text{
  font-size:16px;font-weight:700;color:#065f46;
  margin-bottom:12px;line-height:1.6;
  display:flex;align-items:center;justify-content:center;
}
.intro-expl{
  font-size:13.5px;line-height:1.75;color:#374151;
  border-top:1px dashed #a7f3d0;padding-top:10px;
}

/* ===== 結果 ===== */
.result-card{
  background:#fff;border-radius:16px;padding:40px 24px;
  text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:14px;
}
.result-emoji{font-size:52px;margin-bottom:12px;}
.result-score{font-size:52px;font-weight:800;color:#2563eb;line-height:1;}
.result-total{font-size:16px;color:#64748b;margin-bottom:6px;}
.result-pct{font-size:26px;font-weight:700;color:#374151;margin-bottom:24px;}
.result-actions{display:flex;flex-direction:column;gap:10px;}

/* ===== 送信モード ===== */
.name-card{
  background:#fff;border-radius:12px;padding:16px 20px;
  margin-bottom:13px;box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.name-label{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;display:block;}
.name-input{
  width:100%;padding:10px 14px;border:2px solid #e2e8f0;
  border-radius:8px;font-size:15px;font-family:inherit;
  outline:none;color:#1a202c;transition:border-color .2s;
}
.name-input:focus{border-color:#2563eb;}
.sub-result{
  padding:16px;border-radius:10px;text-align:center;
  margin-bottom:16px;font-size:14px;line-height:1.8;
}
.sub-result.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;}
.sub-result.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;}
.submit-btn{
  width:100%;padding:14px;background:#059669;color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;margin-bottom:10px;transition:background .2s;
}
.submit-btn:hover{background:#047857;}
.submit-btn:disabled{background:#9ca3af;cursor:not-allowed;}

/* ===== 完了・準備中 ===== */
.done-card,.coming-card{
  background:#fff;border-radius:16px;padding:44px 24px;
  text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.done-icon,.coming-icon{font-size:52px;margin-bottom:14px;}
.done-title{font-size:18px;font-weight:700;color:#1a202c;margin-bottom:6px;}
.done-sub{font-size:13px;color:#64748b;margin-bottom:24px;}
.done-actions{display:flex;flex-direction:column;gap:10px;}
.coming-title{font-size:18px;font-weight:600;color:#374151;margin-bottom:8px;}
.coming-text{font-size:14px;color:#6b7280;}

/* ===== 図 ===== */
.diagram-box{
  background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.09);margin-bottom:12px;
}
.diagram-box svg{display:block;width:100%;height:auto;}

/* ===== KaTeX ===== */
.katex{font-size:1em;}
.katex-display{margin:.3em 0;}
</style>
</head>
<body>

<header>
  <div class="hdr-school">神奈川県立湘南高等学校　物理</div>
  <div class="hdr-title">🌌 万有引力 基本知識</div>
  <div class="hdr-sub" id="hdrSub"></div>
</header>

<div class="tabs"><div class="tabs-inner" id="tabs"></div></div>

<div class="main">
  <div class="mode-row">
    <button class="mode-btn" id="modeIntro"  onclick="setMode('intro')">🔰 初学モード</button>
    <button class="mode-btn" id="modeStudy"  onclick="setMode('study')">📖 自習モード</button>
    <button class="mode-btn" id="modeSubmit" onclick="setMode('submit')">📤 送信モード</button>
  </div>
  <div id="content"></div>
</div>

<script>
var renderReady = false;
var pendingRender = null;

// ============================================================
// CONFIGURATION
// ============================================================
const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwx1RqClKjzSOvhyGBdfx0QXXoSAMVG3gAnEZB4ZaRlLcE6KNp-UBfP0BResca7XQQ/exec';

// ============================================================
// SECTIONS & QUESTIONS  （choices[0] が常に正解）
// ============================================================
const SECTIONS = [
  {
    id:1, label:'① ケプラーの法則', subtitle:'ケプラーの法則と万有引力', available:true,
    questions:[
      { id:1, text:'ティコ・ブラーエの膨大な観測結果をもとに、万有引力の法則につながる天体に関する三法則を発見したのはだれか。',
        choices:['ケプラー','ニュートン','ガリレオ','ハッブル'] },
      { id:2, text:'ケプラーの第一法則によると、太陽系の惑星はどのような軌道をしているか。',
        choices:['太陽を焦点とする楕円軌道','太陽を中心とする円軌道'] },
      { id:3, text:'ケプラーの第二法則によると、惑星の運動において一定であるのは次のどれか。',
        choices:['面積速度','速さ','加速度'] },
      { id:4, text:'ケプラーの第三法則によると、公転周期 $T$ と半長軸 $a$ の間にはどのような関係があるか。',
        choices:['$\\dfrac{T^2}{a^3}=k$','$\\dfrac{T^2}{a^2}=k$','$\\dfrac{T^3}{a^2}=k$','$\\dfrac{T^3}{a^3}=k$'] },
      { id:5, ctx:'【万有引力の導出①】質量 $m$ の惑星の楕円軌道を半径 $r$ の円軌道と近似する。惑星にはたらく向心力を $F$、角速度を $\\omega$ とする。',
        text:'このとき、運動方程式は',
        choices:['$F=mr\\omega^2$','$F=\\dfrac{m\\omega^2}{r}$'] },
      { id:6, ctx:'【万有引力の導出②】ケプラーの第三法則において、半長軸 $a$ を $r$ に置きかえる。',
        text:'このとき $T^2$ は',
        choices:['$kr^3$','$kr^2$','$\\dfrac{k}{r^3}$'] },
      { id:7, text:'角速度 $\\omega$ を周期 $T$ を用いて表すと',
        choices:['$\\omega=\\dfrac{2\\pi}{T}$','$\\omega=2\\pi T$','$\\omega=\\dfrac{T}{2\\pi}$'] },
      { id:8, text:'$T^2=kr^3$ および $\\omega=\\dfrac{2\\pi}{T}$ から、運動方程式 $F=mr\\omega^2$ を変形すると',
        choices:['$F=\\dfrac{4\\pi^2 m}{kr^2}$','$F=\\dfrac{2\\pi^2 m}{kr^2}$','$F=\\dfrac{4\\pi^2 m}{kr^3}$','$F=\\dfrac{4\\pi^2 m}{kr}$'] },
      { id:9, ctx:'ニュートンは $F=\\dfrac{4\\pi^2 m}{kr^2}$ が太陽と惑星の間にはたらく力であり、作用・反作用の法則から太陽の質量 $M$ も含まれるはずだと考えた。',
        text:'定数 $G$ と太陽の質量 $M$ を用いると',
        choices:['$\\dfrac{4\\pi^2}{k}=GM$','$\\dfrac{4\\pi^2}{kr^2}=GM$','$\\dfrac{4\\pi^2}{k}=\\dfrac{G}{M}$','$\\dfrac{4\\pi^2}{k}=\\dfrac{M}{G}$'] },
      { id:10, text:'$F=\\dfrac{4\\pi^2 m}{kr^2}$ において $\\dfrac{4\\pi^2}{k}=GM$ とおくと、万有引力の法則は',
        choices:['$F=G\\dfrac{Mm}{r^2}$','$F=G\\dfrac{Mm}{r}$','$F=\\dfrac{Gm}{r^2}$','$F=\\dfrac{GM}{r^2}$'] }
    ]
  },
  {
    id:2, label:'② 宇宙速度', subtitle:'位置エネルギーと宇宙速度', available:true,
    questions:[
      { id:11, ctx:'質量 $m$ の物体を距離 $r$ の地点から無限遠までゆっくり運ぶとき、万有引力 $F=G\\dfrac{Mm}{r^2}$ に逆らってした仕事は距離 $r$ 地点と無限遠地点の万有引力による位置エネルギー $U$ の差に等しい。つまり、万有引力 $F=G\\dfrac{Mm}{r^2}$ を $r$ から無限大まで積分した値と等しい。無限遠を $U=0$ の基準とする。',
        text:'距離 $r$ 地点における万有引力による位置エネルギー $U$ は',
        choices:['$U=-G\\dfrac{Mm}{r}$','$U=-G\\dfrac{Mm}{r^2}$','$U=G\\dfrac{Mm}{r}$','$U=-G\\dfrac{Mm}{r^3}$'] },
      { id:12, text:'第一宇宙速度とはどれか。',
        choices:['地球の表面上を等速円運動する最小の速さ','地球から無限遠に到達する最小の初速度の大きさ','太陽系を抜け出すために必要な初速度の大きさ'] },
      { id:13, ctx:'【第一宇宙速度の導出】地球の半径を $R$、質量を $M$、物体の質量を $m$、万有引力定数を $G$ とする。地表での等速円運動において、向心力は万有引力に等しい。',
        text:'向心力 $F$ は',
        choices:['$F=G\\dfrac{Mm}{R^2}$','$F=G\\dfrac{Mm}{2R}$','$F=\\dfrac{GM}{R^2}$','$F=G\\dfrac{Mm}{R^3}$'] },
      { id:14, text:'向心力 $G\\dfrac{Mm}{R^2}$ と速さ $v$ の円運動の運動方程式は',
        choices:['$G\\dfrac{Mm}{R^2}=\\dfrac{mv^2}{R}$','$G\\dfrac{Mm}{R^2}=mRv^2$','$G\\dfrac{Mm}{R^2}=\\dfrac{mR}{v^2}$'] },
      { id:15, text:'運動方程式 $G\\dfrac{Mm}{R^2}=\\dfrac{mv^2}{R}$ より、第一宇宙速度 $v$ は',
        choices:['$v=\\sqrt{\\dfrac{GM}{R}}$','$v=\\dfrac{GM}{R}$','$v=\\left(\\dfrac{GM}{R}\\right)^{3/2}$','$v=\\sqrt{\\dfrac{R}{GM}}$'] },
      { id:16, text:'第二宇宙速度とはどれか。',
        choices:['地球から無限遠に到達する最小の初速度の大きさ','地球の表面上を等速円運動する最小の速さ','太陽系を抜け出すために必要な初速度の大きさ'] },
      { id:17, ctx:'【第二宇宙速度の導出】地球の半径を $R$、質量を $M$、物体の質量を $m$、万有引力定数を $G$ とする。地球表面から初速 $v$ で鉛直に打ち上げる。',
        text:'地球表面での力学的エネルギー $E$ は',
        choices:['$E=\\dfrac{1}{2}mv^2-G\\dfrac{Mm}{R}$','$E=\\dfrac{1}{2}mv^2+G\\dfrac{Mm}{R}$','$E=\\dfrac{1}{2}mv^2-G\\dfrac{Mm}{R^2}$','$E=\\dfrac{1}{2}mv^2+G\\dfrac{Mm}{R^2}$'] },
      { id:18, text:'無限遠に到着したとき速さが $0$ になったとすると、無限遠での力学的エネルギーは',
        choices:['$0$','$\\infty$','$-G\\dfrac{Mm}{R}$'] },
      { id:19, text:'力学的エネルギー保存則 $\\dfrac{1}{2}mv^2-G\\dfrac{Mm}{R}=0$ より、第二宇宙速度 $v$ は',
        choices:['$v=\\sqrt{\\dfrac{2GM}{R}}$','$v=\\dfrac{2GM}{R}$','$v=\\sqrt{\\dfrac{GM}{R}}$','$v=\\sqrt{\\dfrac{R}{2GM}}$'] }
    ]
  },
  {
    id:3, label:'③ 重力と万有引力', subtitle:'重力加速度と万有引力', available:true,
    questions:[
      { id:20, text:'地球表面での重力加速度の大きさを $g$ とすると、質量 $m$ の物体にはたらく重力の大きさは',
        choices:['$mg$','$m$','$mG$'] },
      { id:21, ctx:'地球表面の地球の中心からの距離（地球の半径）を $R$、地球の質量を $M$、万有引力定数を $G$ とする。',
        text:'質量 $m$ の物体にはたらく万有引力の大きさは',
        choices:['$G\\dfrac{Mm}{R^2}$','$G\\dfrac{Mm}{R}$','$G\\dfrac{Mm}{2R^2}$','$\\dfrac{Gm}{R^2}$'] },
      { id:22, ctx:'重力の大きさ $mg$ は、地球と物体の間にはたらく万有引力の大きさ $G\\dfrac{Mm}{R^2}$ に他ならない。',
        text:'重力加速度 $g$ を $G$，$M$，$R$ を用いて表すと',
        choices:['$\\dfrac{GM}{R^2}$','$\\dfrac{GM}{R}$','$\\dfrac{Gm}{R^2}$','$\\dfrac{R^2}{GM}$'] },
      { id:23, text:'地球は自転をしているので、実際には重力の大きさと万有引力の大きさは一致しない。このとき考慮すべき力は何か。',
        choices:['慣性力（遠心力）','空気抵抗力','向心力','復元力'] },
      { id:24, ctx:'$g=\\dfrac{GM}{R^2}$ とする。',
        text:'地球表面から高さ $h$ の地点における万有引力の大きさを $m,g,R,h$ を用いて表すと',
        choices:['$\\dfrac{mgR^2}{(R+h)^2}$','$mg$','$\\dfrac{mgR}{(R+h)^2}$','$\\dfrac{mgR^2}{R+h}$'] },
      { id:25, ctx:'無限遠を万有引力による位置エネルギーの基準とする。$g=\\dfrac{GM}{R^2}$ とする。',
        text:'高さ $h$ における物体がもつ万有引力による位置エネルギーを $m,g,R,h$ を用いて表すと',
        choices:['$-\\dfrac{mgR^2}{R+h}$','$-\\dfrac{mgR}{R+h}$','$\\dfrac{mgR^2}{R+h}$','$-\\dfrac{mgR^2}{(R+h)^2}$'] },
      { id:26, ctx:'地球表面を万有引力による位置エネルギーの基準とする。$g=\\dfrac{GM}{R^2}$ とする。',
        text:'高さ $h$ における万有引力による位置エネルギーを $m,g,R,h$ を用いて表すと',
        choices:['$\\dfrac{mghR}{R+h}$','$mgh$','$\\dfrac{mgR}{R+h}$','$\\dfrac{mghR^2}{R+h}$'] }
    ]
  },
  {
    id:4, label:'④ 人工衛星', subtitle:'人工衛星と楕円軌道', available:true,
    note:'基本④の問題は全てつながっています。',
    questions:[
      { id:27, ctx:'地球の質量を $M$、半径を $R$、万有引力定数を $G$ とする。地球の周りを半径 $2R$ で等速円運動する質量 $m$ の衛星がある。衛星の速さを $v_0$ とする。',

function shuffle(a) {
  const r=[...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}

function doMath(el) {
  const go = () => renderMathInElement(el, {
    delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
    throwOnError:false
  });
  if (renderReady) go();
  else pendingRender = go;
}

function choiceToHtml(s) {
  if (typeof katex !== 'undefined' && s.includes('$')) {
    try {
      return s.replace(/\$([^$]+)\$/g, (_,m) =>
        katex.renderToString(m, {throwOnError:false, displayMode:false})
      );
    } catch(e) { return s; }
  }
  return s.replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  return q.ctx ? `<div class="q-ctx">${q.ctx}</div>` : '';
}

function secNoteHtml(sec) {
  return sec.note ? `<div class="sec-note">📌 ${sec.note}</div>` : '';
}

function secDiagramHtml(sec) {
  return SEC_DIAGRAM[sec.id] ? `<div class="diagram-box">${SEC_DIAGRAM[sec.id]}</div>` : '';
}

function qDiagramHtml(q) {
  return Q_DIAGRAM[q.id] ? `<div class="diagram-box">${Q_DIAGRAM[q.id]}</div>` : '';
}

// ============================================================
// TABS
// ============================================================
function buildTabs() {
  document.getElementById('tabs').innerHTML = SECTIONS.map(s => `
    <div class="tab ${s.id===curSec?'active':''} ${!s.available?'disabled':''}"
         onclick="${s.available?'setSec('+s.id+')':''}">
      ${s.label}
    </div>`).join('');
}

function setSec(id) {
  curSec = id;
  im.secId = null; ss.secId = null; sm.secId = null; sm.started = false;
  buildTabs(); render();
}

// ============================================================
// MODE
// ============================================================
function setMode(m) {
  curMode = m;
  ['modeIntro','modeStudy','modeSubmit'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  document.getElementById(m==='intro'?'modeIntro':m==='study'?'modeStudy':'modeSubmit')
    .classList.add('active');
  render();
}

// ============================================================
// RENDER DISPATCH
// ============================================================
function render() {
  const sec = SECTIONS.find(s=>s.id===curSec);
  const mLabel = curMode==='intro'?'🔰 初学モード':curMode==='study'?'📖 自習モード':'📤 送信モード';
  document.getElementById('hdrSub').textContent = `${sec.subtitle}　｜　${mLabel}`;
  if (!sec.available) { renderComing(sec); return; }
  if (curMode==='intro')  renderIntro(sec);
  else if (curMode==='study')  renderStudy(sec);
  else renderSubmit(sec);
}

// ============================================================
// COMING SOON
// ============================================================
function renderComing(sec) {
  document.getElementById('content').innerHTML = `
    <div class="coming-card">
      <div class="coming-icon">🚧</div>
      <div class="coming-title">準備中です</div>
      <div class="coming-text">${sec.label} は現在作成中です。<br>しばらくお待ちください。</div>
    </div>`;
}

// ============================================================
// 初学モード
// ============================================================
function renderIntro(sec) {
  if (im.secId !== sec.id) { im.secId=sec.id; im.idx=0; }
  if (im.idx >= sec.questions.length) { renderIntroDone(sec); return; }

  const q    = sec.questions[im.idx];
  const tot  = sec.questions.length;
  const pct  = Math.round(im.idx/tot*100);
  const expl = EXPLANATIONS[q.id] || '';

  const el = document.getElementById('content');
  el.innerHTML = `
    ${secNoteHtml(sec)}
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${im.idx+1} / ${tot}</div>
    </div>
    <div class="q-card">
      <div class="q-num">問 ${im.idx+1}</div>
      ${ctxHtml(q)}
      <div class="q-text">${q.text}</div>
    </div>
    ${qDiagramHtml(q)}
    <div class="intro-answer">
      <div class="intro-answer-label">✅ 正解</div>
      <div class="intro-answer-text">${choiceToHtml(q.choices[0])}</div>
      <div class="intro-expl">💡 ${expl}</div>
    </div>
    ${secDiagramHtml(sec)}
    <button class="next-btn" onclick="nextIntro()">
      ${im.idx+1 < tot ? '次へ →' : '✅ 完了'}
    </button>`;
  doMath(el);
}

function nextIntro() {
  im.idx++;
  renderIntro(SECTIONS.find(s=>s.id===curSec));
}

function renderIntroDone(sec) {
  document.getElementById('content').innerHTML = `
    <div class="done-card">
      <div class="done-icon">🎓</div>
      <div class="done-title">${sec.label} の学習が終わりました</div>
      <div class="done-sub">全 ${sec.questions.length} 問を確認しました。<br>自習モードで理解度を確かめましょう。</div>
      <div class="done-actions">
        <button class="next-btn gray" onclick="im.idx=0;renderIntro(SECTIONS.find(s=>s.id===curSec))">🔄 もう一度読み直す</button>
        <button class="next-btn green" onclick="setMode('study')">📖 自習モードへ進む</button>
      </div>
    </div>`;
}

// ============================================================
// 自習モード（キューベース・再出題あり）
// ============================================================
function setOrderMode(m) {
  orderMode = m;
  ss.secId  = null;
  ss.chosen = [];
  render();
}

function startStudy(sec) {
  ss.secId     = sec.id;
  ss.total     = sec.questions.length;
  ss.queue     = orderMode === 'rand'
                   ? shuffle([...sec.questions])
                   : [...sec.questions];
  ss.solved    = new Set();
  ss.attempted = new Set();
  ss.answered  = false;
  ss.correct   = 0;
  ss.wrong     = 0;
  ss.chosen    = [];
  renderStudy(sec);
}

function renderStudy(sec) {
  if (ss.secId !== sec.id || (ss.queue.length === 0 && ss.solved.size === 0)) {
    startStudy(sec); return;
  }
  if (ss.queue.length === 0) { renderResult(sec); return; }

  const q       = ss.queue[0];
  const isRetry = ss.attempted.has(q.id);
  const pct     = Math.round((ss.solved.size / ss.total) * 100);

  if (ss.chosen.length === 0) ss.chosen = shuffle(q.choices.map((_,i)=>i));

  const el = document.getElementById('content');
  el.innerHTML = `
    ${secNoteHtml(sec)}
    <div class="order-row">
      <span class="order-label">出題順：</span>
      <button class="order-btn ${orderMode==='seq'?'active':''}" onclick="setOrderMode('seq')">学習順</button>
      <button class="order-btn ${orderMode==='rand'?'active':''}" onclick="setOrderMode('rand')">ランダム</button>
    </div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${ss.solved.size} / ${ss.total} 問正解</div>
    </div>
    <div class="score-row" id="scoreRow">✅ ${ss.correct} &nbsp;❌ ${ss.wrong}</div>
    ${isRetry ? '<div class="retry-badge">🔄 再チャレンジ問題</div>' : ''}
    <div class="q-card">
      <div class="q-num">問 ${q.id}</div>
      ${ctxHtml(q)}
      <div class="q-text">${q.text}</div>
    </div>
    ${qDiagramHtml(q)}
    <div class="choices" id="clist">
      ${ss.chosen.map((ci,pos)=>`
        <button class="choice-btn" id="cb${pos}" onclick="pick(${pos})"
                ${ss.answered?'disabled':''}>
          ${choiceToHtml(q.choices[ci])}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn" id="nb" onclick="nextQ()" style="display:none;">次の問題 →</button>
    ${secDiagramHtml(sec)}`;
  doMath(el);
}

function pick(pos) {
  if (ss.answered) return;
  ss.answered = true;
  const q           = ss.queue[0];
  const isCorrect   = ss.chosen[pos] === 0;
  const firstTime   = !ss.attempted.has(q.id);
  if (firstTime) {
    ss.attempted.add(q.id);
    isCorrect ? ss.correct++ : ss.wrong++;
  }
  if (isCorrect) ss.solved.add(q.id);
  ss.lastCorrect = isCorrect;

  ss.chosen.forEach((ci,p) => {
    const btn = document.getElementById('cb'+p);
    if (!btn) return;
    btn.disabled = true;
    if (ci===0)            btn.classList.add('correct');
    else if (p===pos&&!isCorrect) btn.classList.add('wrong');
  });
  const fb   = document.getElementById('fb');
  const expl = EXPLANATIONS[q.id] || '';
  fb.className = 'feedback ' + (isCorrect?'ok':'ng');
  fb.innerHTML = isCorrect
    ? `✅ 正解！${expl?`<br><span class="fb-expl">💡 ${expl}</span>`:''}`
    : `❌ 不正解。正解は「${choiceToHtml(q.choices[0])}」です。もう一度あとで出題されます。${expl?`<br><span class="fb-expl">💡 ${expl}</span>`:''}`;
  doMath(fb);
  document.getElementById('scoreRow').innerHTML = `✅ ${ss.correct} &nbsp;❌ ${ss.wrong}`;
  const nb = document.getElementById('nb');
  nb.textContent = (isCorrect && ss.queue.length-1===0) ? '結果を見る →' : '次の問題 →';
  nb.style.display = 'block';
}

function nextQ() {
  const q = ss.queue.shift();
  if (!ss.solved.has(q.id)) ss.queue.push(q);
  ss.answered = false; ss.chosen = [];
  renderStudy(SECTIONS.find(s=>s.id===curSec));
}

function renderResult(sec) {
  const pct   = Math.round((ss.correct/ss.total)*100);
  const emoji = pct>=90?'🎉':pct>=70?'👍':pct>=50?'🤔':'😢';
  document.getElementById('content').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${ss.correct}</div>
      <div class="result-total">/ ${ss.total} 問正解（1回目の解答時点）</div>
      <div class="result-pct">${pct}%</div>
      <div class="result-actions">
        <button class="next-btn" onclick="startStudy(SECTIONS.find(s=>s.id===${curSec}))">🔄 もう一度やり直す</button>
        <button class="next-btn green" onclick="setMode('submit')">📤 送信モードへ</button>
      </div>
    </div>`;
}

// ============================================================
// 送信モード（キューベース・再出題あり）
// ============================================================
function renderSubmit(sec) {
  if (sm.secId !== sec.id || !sm.started) { renderSubmitIntro(sec); return; }
  if (sm.queue.length === 0)               { renderSubmitFinal(sec); return; }
  renderSubmitQuestion(sec);
}

function renderSubmitIntro(sec) {
  document.getElementById('content').innerHTML = `
    <div class="name-card">
   <label class="name-label" for="snum">組番号を入力してください<br>
        <span style="font-weight:400;font-size:.82em;color:#64748b;">
          ※学年＋クラス＋出席番号の4桁（例：2年1組3番 → 2103）
        </span>
      </label>
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="name-input" id="snum"
             placeholder="例：2101～3940"
             value="${sm.secId===sec.id ? sm.num : ''}">
    </div>
    <div class="name-card">
      <label class="name-label" for="sname">氏名を入力してください</label>
      <input type="text" class="name-input" id="sname"
             placeholder="例：湘南 太郎"
             value="${sm.secId===sec.id ? sm.name : ''}">
    </div>
    <button class="next-btn" onclick="startSubmitQuiz(${sec.id})">
      ✏️ 回答を開始する（全 ${sec.questions.length} 問）
    </button>`;
}

function startSubmitQuiz(secId) {
  const num  = document.getElementById('snum').value.trim();
  const name = document.getElementById('sname').value.trim();
  if (!num)  { alert('組番号を入力してください'); return; }
  if (!name) { alert('氏名を入力してください');   return; }
  const sec = SECTIONS.find(s=>s.id===secId);
  sm.secId              = secId;
  sm.num                = num;
  sm.name               = name;
  sm.started            = true;
  sm.startedAt          = Date.now();   // 所要時間の計測用
  sm.total              = sec.questions.length;
  sm.queue              = [...sec.questions];
  sm.solved             = new Set();
  sm.attempted          = new Set();
  sm.firstAttemptCorrect= {};
  sm.answered           = false;
  sm.chosen             = [];
  sm.lastPickedCi       = null;
  renderSubmit(sec);
}

function renderSubmitQuestion(sec) {
  const q       = sm.queue[0];
  const isRetry = sm.attempted.has(q.id);
  const pct     = Math.round((sm.solved.size / sm.total) * 100);

  if (sm.chosen.length === 0) sm.chosen = shuffle(q.choices.map((_,i)=>i));
  const selCi    = sm.lastPickedCi;
  const willEnd  = sm.answered && sm.lastCorrect && sm.queue.length-1===0;
  const expl     = EXPLANATIONS[q.id] || '';

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="name-card" style="display:flex;align-items:center;gap:8px;padding:10px 16px;">
      <span style="font-size:12px;color:#64748b;">📤 送信モード</span>
      <strong style="font-size:13px;color:#2563eb;">${sm.num}　${sm.name}</strong>
    </div>
    ${secNoteHtml(sec)}
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${sm.solved.size} / ${sm.total} 問正解</div>
    </div>
    ${isRetry ? '<div class="retry-badge">🔄 再チャレンジ問題</div>' : ''}
    <div class="q-card">
      <div class="q-num">問 ${q.id}</div>
      ${ctxHtml(q)}
      <div class="q-text">${q.text}</div>
    </div>
    ${qDiagramHtml(q)}
    <div class="choices">
      ${sm.chosen.map((ci,pos)=>{
        let cls='';
        if (sm.answered) {
          if (ci===0) cls='correct';
          else if (ci===selCi&&ci!==0) cls='wrong';
        }
        return `<button class="choice-btn ${cls}" onclick="pickSM(${pos})"
                        ${sm.answered?'disabled':''}>
                  ${choiceToHtml(q.choices[ci])}</button>`;
      }).join('')}
    </div>
    ${sm.answered ? `
      <div class="sm-explanation">
        <span class="sm-expl-icon">💡</span><span>${expl}</span>
      </div>
      <button class="next-btn" onclick="nextSubmitQ()">
        ${willEnd ? '✅ 送信画面へ →' : '次の問題 →'}
      </button>` : ''}
    ${secDiagramHtml(sec)}`;
  doMath(el);
}

function pickSM(pos) {
  if (sm.answered) return;
  sm.answered = true;
  const q          = sm.queue[0];
  const isCorrect  = sm.chosen[pos] === 0;
  const firstTime  = !sm.attempted.has(q.id);
  if (firstTime) {
    sm.attempted.add(q.id);
    sm.firstAttemptCorrect[q.id] = isCorrect;
  }
  if (isCorrect) sm.solved.add(q.id);
  sm.lastCorrect   = isCorrect;
  sm.lastPickedCi  = sm.chosen[pos];
  renderSubmitQuestion(SECTIONS.find(s=>s.id===sm.secId));
}

function nextSubmitQ() {
  const q = sm.queue.shift();
  if (!sm.solved.has(q.id)) sm.queue.push(q);
  sm.answered    = false;
  sm.chosen      = [];
  sm.lastPickedCi= null;
  renderSubmit(SECTIONS.find(s=>s.id===sm.secId));
}

function renderSubmitFinal(sec) {
  const correct = sec.questions.filter(q=>sm.firstAttemptCorrect[q.id]).length;
  const total   = sec.questions.length;
  document.getElementById('content').innerHTML = `
    <div class="done-card">
      <div class="done-icon">📝</div>
      <div class="done-title">全 ${total} 問の回答が完了しました</div>
      <div style="font-size:15px;color:#2563eb;font-weight:600;margin-bottom:4px;">
        ${sm.num}　${sm.name} さん
      </div>
      <div style="font-size:17px;font-weight:700;margin-bottom:20px;">
        得点（1回目正解）：<span style="color:#2563eb;font-size:26px;">${correct}</span> / ${total}
      </div>
      <button class="submit-btn" id="sbtn" onclick="doSubmit(${sec.id})">📤 記録を送信する</button>
      <div id="sresult"></div>
    </div>`;
}

// ============================================================
//  記録送信（学習記録ハブ  スキーマ v1）
// ============================================================
// ハブGASのデプロイURL
const HUB_URL = 'https://script.google.com/macros/s/AKfycbwnV8z1aoFsLF0NEEgFXZEVktKKNVqm8Fnvrm4Z772M1df-VZKJRAljAZBHgRkInIVX/exec';

// 単元マスタ.xlsx「アプリ設定」シートの gravitation の行から転記
const APP_ID  = 'gravitation';
const UNIT_ID = 'MEC07';
// ★配列の並びはタブ（①〜④）の並びと一致させること
const SEC_IDS = ['MEC07-S1', 'MEC07-S2', 'MEC07-S3', 'MEC07-S4'];

// 移行期のみ true。旧スプレッドシートにも同じ内容を送る。
// ハブ側で記録できていることを確認したら false にする。
const SEND_LEGACY = true;

let _sub = null;   // 直前の送信内容（結果表示用）

function doSubmit(secId) {
  const sec     = SECTIONS.find(s=>s.id===secId);
  const qids    = sec.questions.map(q=>q.id);
  const correct = qids.filter(id=>sm.firstAttemptCorrect[id]).length;
  const elapsed = sm.startedAt ? Math.round((Date.now()-sm.startedAt)/1000) : 0;

  _sub = { num:sm.num, name:sm.name, correct, total:qids.length };

  if (!HUB_URL && !(SEND_LEGACY && SUBMIT_URL)) {
    document.getElementById('sresult').innerHTML = `
      <div class="sub-result warn">⚠️ 送信先URLが未設定です。<br>
        <strong>${sm.num}　${sm.name}</strong> さんの得点：<strong>${correct} / ${_sub.total}</strong>（1回目正解）
      </div>`;
    return;
  }

  const btn = document.getElementById('sbtn');
  if (btn) { btn.disabled = true; btn.textContent = '📤 送信中…'; }

  sendRecord(sec, qids, correct, elapsed).then(ok => showSubmitResult(ok, btn));
}

/* ── ハブ（＋移行期は旧GAS）へ送信 ── */
async function sendRecord(sec, qids, correct, elapsed) {
  const marks = qids.map(id => (sm.firstAttemptCorrect[id] ? '1' : '0')).join('');
  let ok = null;

  if (HUB_URL) {
    const secId = SEC_IDS[sec.id - 1];
    if (!secId) {
      console.error('SEC_IDS に ' + sec.label + ' の定義がありません');
    } else {
      const p = new URLSearchParams();
      p.set('v',       '1');
      p.set('app',     APP_ID);
      p.set('unit',    UNIT_ID);
      p.set('sec',     secId);           // ★恒久ID。単元マスタとの結合キー
      p.set('section', sec.subtitle);    // 保険（マスタ側の名前が優先される）
      p.set('cls',     sm.num);          // 組番号 → 名簿で生徒IDに解決される
      p.set('name',    sm.name);
      p.set('mode',    '送信');
      p.set('qids',    qids.join(','));
      p.set('marks',   marks);           // 例 "1011…"（○×より遥かに短い）
      p.set('elapsed', String(elapsed));
      p.set('comment', '');
      ok = await beacon(HUB_URL + '?' + p.toString());
    }
  }

  if (SEND_LEGACY && SUBMIT_URL) {
    const q = new URLSearchParams({
      num      : sm.num,
      name     : sm.name,
      section  : sec.subtitle,
      score    : String(correct),
      total    : String(qids.length),
      timestamp: new Date().toLocaleString('ja-JP')
    });
    qids.forEach(id => q.append('q'+id, sm.firstAttemptCorrect[id] ? '○' : '×'));
    const ok2 = await beacon(SUBMIT_URL + '?' + q.toString());
    if (ok === null) ok = ok2;
  }

  return ok === true;
}

/* ── 画像ビーコン方式（CSP・CORSの影響を受けにくい）／最大3回試行 ── */
function beacon(url) {
  const MAX = 3;
  return (async () => {
    for (let i = 0; i < MAX; i++) {
      const btn = document.getElementById('sbtn');
      if (btn && i > 0) btn.textContent = `🔄 再送信中…(${i+1}/${MAX})`;
      const reached = await new Promise(resolve => {
        const img   = new Image();
        const timer = setTimeout(() => resolve(false), 6000);
        img.onload  = () => { clearTimeout(timer); resolve(true); };
        img.onerror = () => { clearTimeout(timer); resolve(true); };  // 到達はしている
        img.src = url;
      });
      if (reached) return true;
      await new Promise(r => setTimeout(r, 1500));
    }
    return false;
  })();
}

/* ── 結果表示 ── */
function showSubmitResult(ok, btn) {
  const {num,name,correct,total} = _sub;
  const el = document.getElementById('sresult');
  if (!el) return;

  if (ok) {
    el.innerHTML = `
      <div class="sub-result ok">✅ 送信完了！お疲れ様でした。<br>
        <strong>${num}　${name}</strong> さんの得点（1回目正解）：<strong>${correct} / ${total}</strong>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button class="next-btn" onclick="setMode('study')">📖 自習モードで学習する</button>
        <button class="next-btn" style="background:#059669;"
                onclick="sm.started=false;setMode('submit')">📤 もう一度送信モードで解く</button>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="sub-result warn">❌ 送信に失敗しました。ネットワークを確認してください。<br>
        <strong>${num}　${name}</strong> さんの得点：<strong>${correct} / ${total}</strong>
      </div>`;
    if (btn) { btn.disabled=false; btn.textContent='📤 もう一度送信する'; }
  }
}

// ============================================================
// INIT
// ============================================================
buildTabs();
setMode('study');   // 他アプリと同じく自習モードで開始
</script>
